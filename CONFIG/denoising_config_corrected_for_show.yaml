fs: 200
memory_lean: true
filter:
  enabled: true
  method: butterworth   # "butterworth", "fir", "bessel", "savgol"
  type: highpass   # 'bandpass', 'highpass'
  lowcut: 0.5
  highcut: None
  order: 5
outliers:
  enabled: true
  ekg_min: -3.0
  ekg_max: 4.0
  length_fragment: 200
rdropouts:
  enabled: true
  HR_MIN: 20  # HR
  HR_MAX: 220 # HR
  len_frag: 2000  # Length of each fragment, 10 secs
  step_size: 100 
motions:
  enabled: true
  model_name: "resunet_ecg_1024_0_5_3_7.keras"  # unet model file name
  segment_length: 1024 # Segment length
  overlap: 0.5          # Overlap fraction
  threshold: 0.09  # Residual threshold for noise detection (tune as needed), smaller - more sensitive
merging:
  enabled: True
  t_gap_max_secs: 2.0 # t_gap_max_secs: maximum allowed gap (in seconds) between two intervals before they are merged (default 30 s).
  extra_interval_secs: 2.0   # extra_interval_secs: additional time (in seconds) to consider for merging intervals (default 5 s).
  t_start_gap_max_secs: 2.0 # t_start_gap_max_secs: maximum allowed gap (in seconds) at the start of the signal (default 10 s).
  t_end_gap_max_secs:  2.0   # t_end_gap_max_secs: maximum allowed gap (in seconds) at the end of the signal (default 10 s).
stitching:
  enabled: True
  sliding_window_size_secs: 0.9 # slicing window
  main_window_size_secs: 1.9  # main window_size = slicing_window_size * 5

# check if the conditions are met:
# Not OK. 2*sliding_window_size is not less than main_window_size
# Not OK. main_window_size is not less than all specified values: t_gap_max, extra_interval, t_start_gap_max, t_end_gap_max
